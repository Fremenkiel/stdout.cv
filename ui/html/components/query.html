{{ define "query" }}
<main class="page__query">
  <div class="query">
  <div class="header">
    <h2 class="query__header">Query</h2>
  </div>
    <div class="query__body">
    <form hx-get="/rows" id="form-query" hx-target="#result-main" hx-swap="outerHTML">
      <textarea class="query__textarea" id="textarea-query" name="query">-- Write a query to the database to find all the info.
SELECT * FROM users WHERE id = 1;</textarea>
      <button class="button button--primary query__submit" id="submit-query" type="submit"><svg viewBox="0 0 9 10"><path d="M1 1.2v7.6a.6.6 0 0 0 .9.5l6-3.8a.6.6 0 0 0 0-1l-6-3.8a.6.6 0 0 0-.9.5Z"></path></svg>Run</button>
    </form>
  </div>
  </div>
</main>
{{ end }}
