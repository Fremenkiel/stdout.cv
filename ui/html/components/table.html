{{ define "table" }}
<table class="table">
  <thead>
  <tr class="table__header">
    {{ range .Columns }}
  <th>{{ .Name }}</th>
    {{ end }}
  </tr>
  </thead>
  <tbody>
  {{ range .Rows }}
  <tr class="table__row">
    {{ range . }}
    <td>{{ . }}</td>
    {{ end }}
  </tr>
  {{ end }}
  </tbody>
</table>
{{ end }}
