{{ define "error-container" }}
<div class="error__container" id="error-container">
  <div class="error__header">
    <h1 class="error__title">{{ .Code }}</h1>
    <h2 class="error__description">line {{ if .LineNumber }}{{ .LineNumber }}{{ else }}0{{ end }}, col {{ if .CharStartNumber }}{{ .CharStartNumber }}{{ else }}0{{ end }}</h2>
  </div>
<div class="error__snippet" id="snippet-error"></div>
</div>
{{ if .Code }}
<script>
RenderErrorSnippet(
  "snippet-error",
  {{ if .LineNumber }}{{ .LineNumber }}{{ else }}0{{ end }},
  {{ if .CharStartNumber }}{{ .CharStartNumber }}{{ else }}0{{ end }},
  {{ if .CharEndNumber }}{{ .CharEndNumber }}{{ else }}0{{ end }}
);
</script>
{{ end }}
{{ end }}
