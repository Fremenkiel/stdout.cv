{{ define "main" }}
<!DOCTYPE html>
<html lang="en">
  <head>
    {{ template "header.html" . }}
  </head>
  <body>
    <div class="page">
      <nav class="page__nav">
        {{ template "nav" . }}
      </nav>
      <main class="page__query">
        {{ block "query" . }}
        {{ end }}
      </main>
      <main class="page__result">
        {{ block "result" . }}
        {{ end }}
      </main>
    </div>
  </body>
</html>
{{ end }}
