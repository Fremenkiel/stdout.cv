{{ define "query" }}
<div class="page__query">
  <div class="header">
    <h2>Query</h2>
  </div>
  <div class="query">
    <form hx-get="/rows" hx-target="#row-container" hx-swap="outerHTML">
      <textarea class="query__textarea" id="textarea-query" name="query">-- Write a query to the database to find all the info.
        SELECT * FROM users WHERE id = 1;</textarea>
      <button class="button query__submit" type="submit">Run</button>
    </form>
  </div>
</div>
{{ end }}

{{ define "result" }}
<div class="page__result">
  <div class="header">
    <h2>Results</h2>
  </div>
  <div class="result">
    {{ template "row-container" . }}
  </div>
</div>
<script src="/scripts/code-textarea.js" type="text/javascript"></script>
{{ end }}

{{ template "main" . }}
