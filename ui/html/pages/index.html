{{ define "body" }}
<div class="page">
  {{ template "nav" . }}
  {{ block "query" . }}
  {{ end }}
  {{ if .Error }}
  {{ template "error-result" .Error }}
  {{ else }}
  {{ block "result" .Result }}
  {{ end }}
  {{ end }}
</div>
<script src="/scripts/editor.js" type="text/javascript"></script>
{{ end }}

{{ template "main" . }}
